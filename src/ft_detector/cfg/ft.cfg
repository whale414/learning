#!/usr/bin/env python

PACKAGE = "ft_detector"
#导入必备包
from dynamic_reconfigure.parameter_generator_catkin import *

#创建参数生成器
gen = ParameterGenerator()

#添加参数

#红/蓝的 H、S、V 上下限，最小轮廓⾯积，灯条配对的最⼤间距/⻆度差
#注意：这里的默认值必须和 config/yaml.yaml 一致，
#否则 dynamic_reconfigure 启动时会把 yaml 里的参数覆盖成默认值。

#red1
gen.add("Light_red1_top_H", int_t, 0, "top_H", 10, 0, 180)
gen.add("Light_red1_bottom_H", int_t, 0, "bottom_H", 0, 0, 180)
gen.add("Light_red1_top_S", int_t, 0, "top_S", 255, 0, 255)
gen.add("Light_red1_bottom_S", int_t, 0, "bottom_S", 200, 0, 255)
gen.add("Light_red1_top_V", int_t, 0, "top_V", 255, 0, 255)
gen.add("Light_red1_bottom_V", int_t, 0, "bottom_V", 100, 0, 255)

gen.add("Light_red2_top_H", int_t, 0, "top_H", 180, 0, 180)
gen.add("Light_red2_bottom_H", int_t, 0, "bottom_H", 160, 0, 180)
gen.add("Light_red2_top_S", int_t, 0, "top_S", 255, 0, 255)
gen.add("Light_red2_bottom_S", int_t, 0, "bottom_S", 200, 0, 255)
gen.add("Light_red2_top_V", int_t, 0, "top_V", 255, 0, 255)
gen.add("Light_red2_bottom_V", int_t, 0, "bottom_V", 100, 0, 255)

gen.add("Light_blue_top_H", int_t, 0, "top_H", 130, 0, 180)
gen.add("Light_blue_bottom_H", int_t, 0, "bottom_H", 90, 0, 180)
gen.add("Light_blue_top_S", int_t, 0, "top_S", 255, 0, 255)
gen.add("Light_blue_bottom_S", int_t, 0, "bottom_S", 120, 0, 255)
gen.add("Light_blue_top_V", int_t, 0, "top_V", 255, 0, 255)
gen.add("Light_blue_bottom_V", int_t, 0, "bottom_V", 80, 0, 255)

#灯条有些 偏橙偏黄 的话考虑以下：
#orange1:
gen.add("Light_orange1_top_H", int_t, 0, "top_H", 35, 0, 180)
gen.add("Light_orange1_bottom_H", int_t, 0, "bottom_H", 10, 0, 180)
gen.add("Light_orange1_top_S", int_t, 0, "top_S", 255, 0, 255)
gen.add("Light_orange1_bottom_S", int_t, 0, "bottom_S", 100, 0, 255)
gen.add("Light_orange1_top_V", int_t, 0, "top_V", 255, 0, 255)
gen.add("Light_orange1_bottom_V", int_t, 0, "bottom_V", 100, 0, 255)

gen.add("Light_area_top", double_t, 0, "area_top", 5000.0, 0.0, 20000.0)
gen.add("Light_area_Bottom", double_t, 0, "area_Bottom", 100.0, 0.0, 2000.0)

gen.add("rate_armor_Top", double_t, 0, "rate_armor_Top", 6.0, 0.0, 10.0)
gen.add("rate_armor_Bottom", double_t, 0, "rate_armor_Bottom", 1.5, 0.0, 5.0)

#填充率
gen.add("rect_area_Bottom", double_t, 0, "rect_area_Bottom", 1e-6, 0.0, 1.0)
gen.add("fill_ratio_Bottom", double_t, 0, "fill_ratio_Bottom", 0.6, 0.0, 1.0)

#y轴偏离
gen.add("vertical_distance_Top", double_t, 0, "vertical_distance_Top", 20.0, 0.0, 100.0)

#凸度筛选
gen.add("hull_area_Top", double_t, 0, "hull_area_Top", 1e-6, 0.0, 1.0)
gen.add("solidity_top", double_t, 0, "solidity_top", 0.8, 0.0, 1.0)

gen.add("rate_light_small_Top", double_t, 0, "rate_light_small_Top", 3.5, 0.0, 6.0)

#灯条本身的高宽比范围（yaml 中为 1 ~ 6）
gen.add("rate_Light_Top", double_t, 0, "rate_Light_Top", 6.0, 0.0, 10.0)
gen.add("rate_Light_Bottom", double_t, 0, "rate_Light_Bottom", 1.0, 0.0, 10.0)

gen.add("dis_angle_Top", double_t, 0, "dis_angle_Top", 3.0, 0.0, 20.0)

exit(gen.generate(PACKAGE, "ft_detector", "ft"))

